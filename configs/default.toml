[models.agentworld]
model_id = "Qwen/Qwen-AgentWorld-35B-A3B"
revision = "60d2b0434a53d2e62a7c00a489586815d94ebffb"
cache_directory = "/mnt/work/models/huggingface/hub"
precision = "bfloat16"
backend = "transformers"
local_files_only = true
trust_remote_code = false
max_context_tokens = 2048
max_output_tokens = 64
transformers_probe_passed = false

[models.mock]
model_id = "local/mock-agentworld"
revision = "0000000000000000000000000000000000000000"
precision = "bfloat16"
backend = "mock"
local_files_only = true
trust_remote_code = false
max_context_tokens = 2048
max_output_tokens = 64
transformers_probe_passed = false

[runtime]
request_timeout_seconds = 10
load_timeout_seconds = 900
generation_timeout_seconds = 180
unload_timeout_seconds = 120
stop_timeout_seconds = 10
# Together these form an intentionally conservative 104 GiB pre-load gate for
# an approximately 70 GiB BF16 model. Adjust only after Stage A reports the
# exact snapshot size and temporary-copy behaviour.
minimum_available_memory_gib = 80
minimum_memory_headroom_gib = 24
memory_recovery_tolerance_gib = 4
records_directory = "records"

[thermal]
sample_interval_seconds = 1
caution_celsius = 80
cancel_celsius = 85
terminate_celsius = 90
cooldown_celsius = 75
cooldown_seconds = 30
sensor_labels = ["Tctl", "cpu@4c", "edge"]
